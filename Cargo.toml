[workspace]
members = [
    "crates/rinfuse-core",
    "crates/rinfuse-io",
    "crates/rinfuse-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.76"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
